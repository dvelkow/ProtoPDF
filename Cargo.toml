[package]
name = "protopdf"
version = "0.1.0"
edition = "2021"
description = "Minimal PDF reader with page editing and printing"
rust-version = "1.95"

[[bin]]
name = "ProtoPDF"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
hayro = "0.9"
hayro-interpret = "0.9"
hayro-syntax = "0.9"
lopdf = "0.47"
rfd = "0.18"
# Already used by eframe; read directly for "Paste" in right-click menus.
arboard = { version = "3", default-features = false }
ttf-parser = "0.25"
subsetter = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_UI",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Memory",
]

# Linux: signatures are checked and made with OpenSSL (the system libssl).
[target.'cfg(not(windows))'.dependencies]
openssl = "0.10"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Rendering is unusably slow without optimisation, even in debug builds.
[profile.dev.package."*"]
opt-level = 2
